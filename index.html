<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frog Research Challenge</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(#9ee7ee,#c7f5d0 60%,#78c67e);min-height:100vh;color:#183e38}main{max-width:800px;margin:20px auto;padding:20px}.panel{background:#fffef4eF;border:3px solid #277c60;border-radius:26px;padding:clamp(18px,4vw,32px);box-shadow:0 12px 0 #2d8e6a44}h1{font-size:clamp(28px,6vw,44px);margin:0 0 8px}h2{margin:12px 0;color:#123e34}#question{background:#ffffff;border:3px solid #287d65;border-radius:16px;padding:16px 18px;line-height:1.4;box-shadow:0 4px 0 #2d8e6a22}.muted{color:#466c5f}button,input{font:inherit}input{padding:13px;border-radius:12px;border:2px solid #8cbba3;width:100%;max-width:360px}button{cursor:pointer}button:disabled{cursor:default}.primary{background:#1b8664;color:white;border:0;border-radius:14px;padding:13px 22px;font-weight:800;margin-top:16px}.hidden{display:none!important}.hud{display:flex;justify-content:space-between;gap:8px;font-weight:800}.pond{height:350px;position:relative;overflow:hidden;background:linear-gradient(#dff7ff 0%,#eafbf1 70%,#91d89a 71%);border-radius:22px;border:3px solid #75b8a3;margin:18px 0 10px}.fly{position:absolute;width:43%;max-width:270px;min-height:75px;background:#ffffff;border:4px solid #174c43;border-radius:45px;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;text-align:center;font-weight:850;color:#102b27;font-size:clamp(13px,2.8vw,17px);line-height:1.25;text-shadow:none;box-shadow:0 5px 0 #397c68;z-index:2;animation:hoverFly 2s ease-in-out infinite alternate;transition:opacity .25s,transform .35s}.fly:nth-of-type(2){animation-delay:-.8s}.fly:nth-of-type(3){animation-delay:-1.4s}.fly:nth-of-type(4){animation-delay:-.3s}.fly:hover:not(:disabled),.fly:focus-visible{background:#e4fff2;outline:4px solid #ffb13b;outline-offset:2px}.fly:disabled{opacity:.55}.fly .bug{font-size:25px;flex-shrink:0}.fly.hit{transform:scale(.12) rotate(30deg);opacity:0}.fly.correct{background:#c6ffd8;border-color:#15944d}.fly.wrong{background:#ffd1d6;border-color:#c83e4e}@keyframes hoverFly{to{translate:0 -9px}}.frog{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font-size:95px;z-index:4;line-height:1;filter:drop-shadow(0 6px 2px #367f4a55)}.tongue{position:absolute;height:12px;background:#ff648d;border-radius:14px;transform-origin:left center;z-index:3;opacity:0;pointer-events:none;box-shadow:0 0 0 2px #d94475}.tongue.shoot{opacity:1;transition:width .22s ease-out}.feedback{background:#e4f7e8;padding:14px;border-radius:14px;margin-top:10px;min-height:50px}.rank{width:100%;border-collapse:collapse;margin-top:16px}.rank td,.rank th{padding:10px;border-bottom:1px solid #a8cbb7;text-align:left}.notice{font-size:13px;color:#526e63;margin-top:14px}.status{font-size:13px;margin-top:8px;color:#3c675c}
@media(max-width:480px){.pond{height:390px}.fly{width:46%;min-height:90px}.frog{font-size:78px}.panel{padding:15px}}
</style></head><body><main><div class="panel">
<section id="start"><h1>🐸 Frog Research Challenge</h1><p>Catch the correct fly with your frog's tongue! Answer three questions about research titles and climb the leaderboard.</p><label for="player"><b>Your name</b></label><div><input id="player" maxlength="24" placeholder="Enter your name" autocomplete="nickname"></div><button class="primary" id="begin">Start game</button><p class="notice">Correct answers earn one point. Faster players win ties.</p></section>
<section id="game" class="hidden"><div class="hud"><span id="count"></span><span id="points"></span><span id="timer"></span></div><h2 id="question"></h2><div class="pond" id="pond"><div class="tongue" id="tongue"></div><div class="frog" id="frog">🐸</div></div><div class="feedback hidden" id="feedback" role="status"></div><button class="primary hidden" id="next">Next question →</button></section>
<section id="end" class="hidden"><h1>🏆 Game over!</h1><h2 id="result"></h2><p id="finishText"></p><button class="primary" id="again">Play again</button></section>
<section id="leaders"><h2>🏅 Leaderboard</h2><div id="mode" class="status"></div><table class="rank"><thead><tr><th>#</th><th>Player</th><th>Score</th><th>Time</th></tr></thead><tbody id="ranks"></tbody></table><button class="primary" id="refresh">Refresh ranking</button></section>
</div></main>
<script type="module">
/* GLOBAL RANKING SETUP:
 1. Create a free Firebase project and a Realtime Database.
 2. Paste your Firebase web app configuration below.
 3. Set database rules for the "scores" path (see separate instructions).
 4. Host this HTML on a static hosting service (e.g. GitHub Pages).
 Without configuration, the game works with a local leaderboard on each browser.
*/
const firebaseConfig = {
 apiKey: "AIzaSyAR0c1u-lBabzo4-F1_-4OA_RQeiXBdAlA",
 authDomain: "frog-research-challenge.firebaseapp.com",
 databaseURL: "https://frog-research-challenge-default-rtdb.firebaseio.com",
 projectId: "frog-research-challenge",
 appId: "1:1018646372934:web:f1699b287971f337a4a047"
};
const questions=[
 {q:"Why is a good research title important?",a:["It replaces the introduction.","It summarizes the main idea.","It includes all the results.","It explains every method used."],correct:1,why:"A good title summarizes the main idea and gives readers a quick snapshot of the study."},
 {q:"Which of these four research title elements is optional?",a:["Topic or variables","Population","Location","Timeframe"],correct:3,why:"The presentation describes the timeframe or year as optional."},
 {q:"Which is a good rule for writing a research title?",a:["Add a period at the end.","Start with 'A study of...'","Be clear and specific.","Use uncommon abbreviations."],correct:2,why:"Clear, specific wording helps readers understand your research."}
];
const $=id=>document.getElementById(id);
let db=null,fb=null,player="",index=0,score=0,startTime=0,locked=false,clock=null;
const configured=!!(firebaseConfig.apiKey&&firebaseConfig.databaseURL&&firebaseConfig.projectId);
if(configured){try{const appModule=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");fb=await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js");db=fb.getDatabase(appModule.initializeApp(firebaseConfig));$("mode").textContent="🌐 Shared online leaderboard";fb.onValue(fb.query(fb.ref(db,"scores"),fb.limitToLast(100)),snapshot=>{const scores=Object.values(snapshot.val()||{});draw(scores)},()=>{$("mode").textContent="Unable to load online scores. Check Firebase permissions."})}catch(e){$("mode").textContent="Online connection unavailable; using local ranking."}}
if(!db){$("mode").textContent="📱 Local ranking (this device only). Configure Firebase to share rankings across phones.";draw(readLocal())}
function readLocal(){try{return JSON.parse(localStorage.getItem("frogScores")||"[]")}catch{return []}}
function draw(items){items.sort((a,b)=>b.score-a.score||a.seconds-b.seconds);$("ranks").replaceChildren();items.slice(0,20).forEach((s,i)=>{const tr=document.createElement("tr");[i+1,s.name,`${s.score}/3`,`${Number(s.seconds).toFixed(1)}s`].forEach(t=>{const td=document.createElement("td");td.textContent=t;tr.append(td)});$("ranks").append(tr)});if(!items.length){$("ranks").innerHTML='<tr><td colspan="4">No scores yet. Be the first!</td></tr>'}}
async function loadRanking(){if(db){try{const s=await fb.get(fb.query(fb.ref(db,"scores"),fb.limitToLast(100)));draw(Object.values(s.val()||{}))}catch{}}else draw(readLocal())}
$("refresh").onclick=loadRanking;
function show(id){for(const x of ["start","game","end"])$(x).classList.toggle("hidden",x!==id)}
function start(){player=$("player").value.trim().slice(0,24);if(!player){$("player").focus();return}index=0;score=0;startTime=performance.now();clearInterval(clock);clock=setInterval(()=>{$("timer").textContent=`⏱ ${((performance.now()-startTime)/1000).toFixed(1)}s`},100);show("game");render()}
$("begin").onclick=start;$("player").addEventListener("keydown",e=>{if(e.key==="Enter")start()});
function render(){locked=false;const q=questions[index];$("count").textContent=`Question ${index+1}/3`;$("points").textContent=`⭐ ${score} points`;$("question").textContent=q.q;$("feedback").classList.add("hidden");$("next").classList.add("hidden");$("tongue").className="tongue";$("tongue").style.width="0";document.querySelectorAll(".fly").forEach(el=>el.remove());const positions=[[3,7],[54,7],[3,40],[54,40]];q.a.forEach((label,i)=>{const b=document.createElement("button");b.className="fly";b.style.left=positions[i][0]+"%";b.style.top=positions[i][1]+"%";b.innerHTML='<span class="bug" aria-hidden="true">🪰</span>';const span=document.createElement("span");span.textContent=label;b.append(span);b.onclick=()=>choose(i,b);$("pond").append(b)})}
function choose(i,button){if(locked)return;locked=true;const q=questions[index];const buttons=[...document.querySelectorAll(".fly")];buttons.forEach(b=>b.disabled=true);const pond=$("pond").getBoundingClientRect(),frog=$("frog").getBoundingClientRect(),target=button.getBoundingClientRect();const x1=frog.left+frog.width/2-pond.left,y1=frog.top+frog.height*.48-pond.top,x2=target.left+target.width/2-pond.left,y2=target.top+target.height/2-pond.top;const dx=x2-x1,dy=y2-y1,tongue=$("tongue");tongue.style.left=x1+"px";tongue.style.top=y1+"px";tongue.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;tongue.style.width="0";requestAnimationFrame(()=>{tongue.classList.add("shoot");tongue.style.width=Math.hypot(dx,dy)+"px"});setTimeout(()=>{button.classList.add("hit");if(i===q.correct)score++;else buttons[q.correct].classList.add("correct");$("points").textContent=`⭐ ${score} points`;$("feedback").textContent=(i===q.correct?"✅ Correct! ":"❌ Not quite. ")+q.why;$("feedback").classList.remove("hidden");$("next").textContent=index===2?"See leaderboard →":"Next question →";$("next").classList.remove("hidden");tongue.style.width="0"},420)}
$("next").onclick=()=>{index++;if(index<3)render();else finish()};
async function finish(){clearInterval(clock);const seconds=Math.round((performance.now()-startTime)/100)/10;show("end");$("result").textContent=`${player}: ${score}/3 points`;$("finishText").textContent=`Completed in ${seconds.toFixed(1)} seconds. ${score===3?"Perfect score!":score===2?"Great job!":"Keep practicing!"}`;const record={name:player,score,seconds,createdAt:Date.now()};if(db){try{await fb.push(fb.ref(db,"scores"),record);$("finishText").textContent+=" Your result was added to the global ranking."}catch{$("finishText").textContent+=" Could not save to global ranking; check your internet connection."}}else{const all=readLocal();all.push(record);localStorage.setItem("frogScores",JSON.stringify(all.slice(-200)));draw(all)}}
$("again").onclick=()=>{show("start");$("player").focus()};
</script></body></html>
